[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdman"
version = "0.5.5"
description = "Parallel segmented downloader inspired by IDM, with CLI and Python API."
readme = "README.md"
authors = [{ name = "Akira_TL" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.8",
  "aiofiles>=23.1",
  "yarl>=1.9",
  "rich>=13.0",
  "loguru>=0.7",
  "PyYAML>=6.0",
]
keywords = ["downloader", "parallel", "segments", "cli"]

[project.urls]
Homepage = "https://github.com/Akira-TL/pdman"
Repository = "https://github.com/Akira-TL/pdman.git"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pdman*"]

[project.scripts]
pdman = "pdman.cli:main"
